@if (visible()) {

  @if (menuAbierto()) {

    <div class="fondo-menu" (click)="cerrarMenu()"></div>

    <div class="menu-prevencion">
      @for (opcion of opcionesPrevencion; track opcion.ruta) {
        <button class="opcion-menu" (click)="irAOpcion(opcion.ruta)">
          <ion-icon [name]="opcion.icono"></ion-icon>
          {{ opcion.nombre }}
        </button>
      }
    </div>
  }

  <nav class="barra" [class]="'diseno-' + diseno" aria-label="Navegación principal">

    <div class="indicador" [style.transform]="'translateX(' + (indice() * 100) + '%)'"></div>

    @for (tab of tabs; track tab.ruta; let i = $index) {
      <button class="tab" [class.activa]="indice() === i" [attr.aria-current]="indice() === i ? 'page' : null" (click)="tocarTab(tab)">
        <span class="icono">
          <ion-icon [name]="tab.icono"></ion-icon>
        </span>
        <span class="nombre">{{ tab.nombre }}</span>

        @if (tab.conMenu) {
          <ion-icon name="chevron-up" class="mas" [class.girado]="menuAbierto()"></ion-icon>
        }
      </button>
    }

  </nav>

}
