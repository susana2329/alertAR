<ion-content [fullscreen]="true">

  <div class="pantalla">

    <button class="boton-volver" (click)="volver()" aria-label="Volver">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="contenido">

      <div class="circulo">
        <ion-icon name="location"></ion-icon>
      </div>

      <h1 class="titulo">Tu ubicación<br>nos ayuda a cuidarte</h1>

      <p class="descripcion">
        Para mostrarte información relevante<br>
        y alertas cerca tuyo,<br>
        necesitamos tu ubicación.
      </p>

      <button class="boton-principal" (click)="permitirUbicacion()">Permitir ubicación</button>
      <button class="boton-secundario" (click)="ahoraNo()">Ahora no</button>

      @if (mensaje()) {
        <p class="mensaje">{{ mensaje() }}</p>
      }

    </div>

  </div>

</ion-content>
