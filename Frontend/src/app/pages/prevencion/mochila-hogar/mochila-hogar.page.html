<ion-header class="ion-no-border">
  <div class="header-container">
    <button class="back-button" (click)="volver()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h1>Kit de Emergencia del Hogar</h1>
  </div>
</ion-header>

<ion-content>
  <div class="contenedor">
    
    <div class="progreso-section">
      <div class="progreso-info">
        <div class="barra-fondo">
          <div class="barra-relleno" [style.width]="porcentaje + '%'"></div>
        </div>
        <p>Acondiciona los elementos de la vivienda</p>
      </div>
      <div class="grafico-circular">
        <div class="anillo-progreso" [style.background]="'conic-gradient(#0E7490 ' + porcentaje + '%, #E2E8F0 0)'">
          <div class="centro-blanco">
            <span class="numero">{{ porcentaje }}%</span>
            <span class="texto">Completado</span>
          </div>
        </div>
      </div>
    </div>


    <div class="subtitulo-seccion">
      <div class="icono-mochila">
        <img src="assets/icon/mochila.png" alt="Hogar">
      </div>
      <div class="texto-mochila">
        <h2>Tu Casa</h2>
        <p>Revisa y completa los suministros y herramientas</p>
      </div>
    </div>

    <div class="checklist-container">
      <div class="item-card" *ngFor="let item of checklist" (click)="item.completado = !item.completado">
        <ion-checkbox [(ngModel)]="item.completado" (click)="$event.stopPropagation()"></ion-checkbox>
        <div class="item-textos">
          <h3>{{ item.titulo }}</h3>
          <p>{{ item.subtitulo }}</p>
        </div>
      </div>

      <div class="boton-guardar">
        <ion-button expand="block" (click)="guardarProgreso()">Guardar progreso</ion-button>
      </div>
    </div>

  </div>
</ion-content>
