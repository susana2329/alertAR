<ion-header>
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button routerLink="/cuenta">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="config-container">
    
    <p class="section-label">Ubicación</p>

    
    <div class="main-config-card secondary-card">

      <div class="config-item">
        <div class="card-icon-box">
          <img src="assets/icon/icono-config-ubicacion.png" alt="Icono ubicacion">
        </div>
        <div class="card-content">
          <h3>Ubicación actual</h3>
          <p>Permitir acceso al GPS</p>
        </div>
        <ion-toggle [checked]="ubicacionActiva" mode="ios" (ionChange)="onUbicacionChange($event)"></ion-toggle>
      </div>

    </div>

  </div>
</ion-content>
