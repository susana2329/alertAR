<ion-header>
  <div class="report-header">
    <button class="back-button" type="button" (click)="volverAtras()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    
    <div class="logo-container">
      <img src="assets/image/ALERT.png" alt="Alert" class="logo-img">
      <img src="assets/image/AR.png" alt="AR" class="logo-img">
    </div>
  </div>
</ion-header>

<ion-content>
  <div class="elements">
    <div class="title-section">
      <img src="assets/icon/altavoz.png" alt="Altavoz" class="altavoz-icon">
      
      <div class="subtitulo">
        <h2>Reportar una situacion</h2>
        <p>Tu reporte ayuda a mantener informada a la comunidad</p>
      </div>
    </div>
    <div class="reportes">
      <ion-title>
        <h3>
          ¿Que queres reportar?
        </h3>
      </ion-title>
      <div class="buttons-reports">
        <div class="cardInundaciones">
          <ion-card id="Indundaciones" (click)="creandoReporte($event)">
            <ion-card-content (click)="$event.stopPropagation()">
              <img src="\assets\icon\casa.png" alt="">
              <p>Inundaciones </p>
            </ion-card-content>
          </ion-card>
        </div>
        <div class="cardCalle">
          <ion-card id="Calle-bloqueada" (click)="creandoReporte($event)">
            <ion-card-content>
              <img src="\assets\icon\tormenta.png" alt="">
              <p>Calle bloqueada</p>
            </ion-card-content>
          </ion-card>
        </div>
        <div class="cardArbol">
          <ion-card id="Caida-de-arbol" (click)="creandoReporte($event)">
            <ion-card-content>
              <img src="\assets\icon\arbol-malo.png" alt="">
              <p>Caida de arbol</p>
              
            </ion-card-content>
          </ion-card>
        </div>
        <div class="cardCorteLuz">
          <ion-card id="Corte-de-luz" (click)="creandoReporte($event)">
            <ion-card-content>
              <img src="\assets\icon\foco.png" alt="">
              <p>Corte de luz</p>
              
            </ion-card-content>
          </ion-card>
        </div>
        <div class="cardIncendios">
          <ion-card id="Incendios" (click)="creandoReporte($event)">
            <ion-card-content>
              <img src="\assets\icon\flama.png" alt="">
              <p>incendios</p>
              
            </ion-card-content>
          </ion-card>
        </div>
        <div class="cardMas">
          <ion-card id="otro" (click)="creandoReporte($event)">
            <ion-card-content>
              <img src="\assets\icon\mas.png" alt="">
              <p>
                Otro
              </p>
            </ion-card-content>
          </ion-card>
        </div>
      </div>
    </div>
   <div class="avisoPublic">
      <div class="escudoPublic">
        <img src="\assets\icon\seguridad.png" alt="seguridad">
      </div>
      <p>Tu reporte sera revisado antes de publicarse en el mapa</p>
    </div>
  </div> 
</ion-content>
