<ion-header class="ion-no-border">
  <div class="buttonatras">
    <ion-button (click)="volver()">
      <ion-icon size="small" name="arrow-back-outline"></ion-icon>
    </ion-button>
  </div>
  <div class="logo">
    <ion-title>{{tipo}}</ion-title>
  </div>
</ion-header>

<ion-content>
  <div class="reporte">
    <div class="tituloreporte">

    </div>
    
    <div class="formtipo">
      <ion-label>
        <p>
          Tipo de reporte *
        </p>
      </ion-label>
      <div class="inputtipo">
        <ion-input value="{{tipo}}" [disabled]="bandera" (ionChange)="ingresartipo($event)">
        </ion-input>
      </div>
    </div>
    <div class="formularioreporte">
      <div class="imgform">
        <ion-label>
          <p>
            Fotos
          </p>
        </ion-label>
        <div class="panelfoto">
          <div class="previewimg">
            <div class="buttonimage">
              <div>
                <ion-button (click)="atrasfoto()">
                  🡠
                </ion-button>
              </div>
              <div class="adelantarimg">
                <ion-button (click)="siguientefoto()">
                  🡢
                </ion-button>
              </div>
            </div>

            <img [src]="previewimg[contador] || previewimg[0] || 'assets/icon/camara.png'" alt="Vista previa de foto">

          </div>
          <div class="selectimg" (click)="abrirmodalphotos()">
            <img src="assets\icon\agregar.png" alt="">
          </div>
        </div>
      </div>


      <div class="descripform">
        <div class="titulodescripcion">
          <ion-label>
            <p>
              Descripcion *
            </p>
          </ion-label>
        </div>
        <div class="descripcion">
          <ion-textarea placeholder="Ej: Calle inundada a la altura de la estación, difícil transitar..." maxlength="200"
            [counter]="true" [(ngModel)]="reporte.descripcion">
          </ion-textarea>
        </div>

      </div>
      <div class="ubicacionform">
        <ion-label>
          <p>Ubicacion *</p>
        </ion-label>
        <div class="infoubi">
          <div class="campubi">
            <ion-input [(ngModel)]="reporte.ubicacion"></ion-input>
          </div>
          <div class="buttonubi">

            <ion-button><img src="assets\icon\mapas.png" alt="mapita" style="width:100%; height: 27px;"></ion-button>
          </div>
        </div>
      </div>

      <div class="fechaform">
        <div class="fechahora-labels">
          <ion-label><p>Fecha *</p></ion-label>
          <ion-label><p>Hora</p></ion-label>
        </div>
        
        <div class="fechahora-inputs">
          <div class="datetime-wrapper">
            <ion-datetime-button datetime="datetime"></ion-datetime-button>
          </div>
          
          <div class="btn-calendario">
            <ion-button>
              <img src="assets/icon/calendario.png" alt="calendario">
            </ion-button>
          </div>
        </div>

        <ion-modal [keepContentsMounted]="true">
          <ion-header class="ion-no-border">
            <ion-item>
              <ion-title>
                <h2>Fecha y Hora</h2>
              </ion-title>
            </ion-item>
          </ion-header>
          <ion-datetime id="datetime" (ionChange)="fecha($event)"></ion-datetime>
          <ion-button>Aceptar</ion-button>
        </ion-modal>
      </div>
     
    </div>
    
  </div>

  <div class="buttonenviar">
    <ion-button [class.enviado]="reporteEnviado" (click)="confirmarreport()">
      <div class="contenido-btn normal">
        <img src="assets/icon/enviar.png" class="icono-avion" alt="enviar">
        <span>Enviar reporte</span>
      </div>
      <div class="contenido-btn exito">
        <ion-icon name="checkmark-circle" class="icono-check"></ion-icon>
        <span>Reporte enviado</span>
      </div>

    </ion-button>
  </div>
  
</ion-content>
