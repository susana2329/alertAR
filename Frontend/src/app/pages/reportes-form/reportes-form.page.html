<ion-header [translucent]="true">
  <div class="buttonatras">
    <ion-button (click)="volver()">
      <ion-icon  size="small" name="arrow-back-outline">
      </ion-icon>
    </ion-button>
  </div>
  <div class="logo">
    <ion-toolbar>
      <ion-title>{{tipo}}</ion-title>
    </ion-toolbar>
  </div>

</ion-header>

<ion-content>
  <div class="reporte">
    <div class="tituloreporte">
      <ion-header>
        <ion-toolbar>Agregar informacion</ion-toolbar>
      </ion-header>
    </div>
    <div class="avisoPublic">
      <ion-note>
        <div class="escudoPublic">
          <img src="\assets\icon\notificacion.png" alt="a">
        </div>
        <p>Los títulos que tengan este símbolo "*" son campos obligatorios.</p>
      </ion-note>
    </div>
    <div class="formtipo">
      <ion-label>
        <p>
          Tipo de reporte *
        </p>
      </ion-label>
      <div class="inputtipo">
        <ion-input value="{{tipo}}" [disabled]="bandera" (ionChange)="ingresartipo($event)">
        </ion-input>
      </div>
    </div>
    <div class="formularioreporte">
      <div class="imgform">
        <ion-label>
          <p>
            Foto
          </p>
        </ion-label>
        <div class="panelfoto">
          <div class="previewimg">
            <div class="buttonimage" >
              <div>
                <ion-button (click)="atrasfoto()">
                  🡠
                </ion-button>
              </div>
              <div class="adelantarimg">
                <ion-button (click)="siguientefoto()">
                  🡢
                </ion-button>
              </div>
            </div>
            <img [src]="previewimg[contador] || previewimg[0] || 'assets/icon/camara.png'" alt="Vista previa de foto">

          </div>
          <div class="selectimg" (click)="abrirmodalphotos()">
            <img src="assets\icon\camara.png" alt="">
          </div>
        </div>
      </div>


      <div class="descripform">
        <div class="titulodescripcion">
          <ion-label>
            <p>
              Descripcion *
            </p>
          </ion-label>
        </div>
        <div class="descripcion">
          <ion-textarea placeholder="Calle con mucha agua, dificil transitar. Vi una rata ahogandose" maxlength="200"
            [counter]="true" [(ngModel)]="reporte.descripcion">
          </ion-textarea>
        </div>

      </div>
      <div class="ubicacionform">
        <ion-label>
          <p>Ubicacion *</p>
        </ion-label>
        <div class="infoubi">
          <div class="campubi">
            <ion-input [(ngModel)]="reporte.ubicacion"></ion-input>
          </div>
          <div class="buttonubi">
            <ion-button><img src="assets\icon\mapas.png" alt="mapita" style="width:100%; height: 27px;"></ion-button>
          </div>
        </div>
      </div>

      <div class="fechaform">
        <div class="buttondia">
          <ion-label>
            <p>Fecha *</p>
          </ion-label>
          <ion-datetime-button datetime="datetime"></ion-datetime-button>
        </div>

        <ion-modal [keepContentsMounted]="true">
          <ion-header>
            <ion-item>
              <ion-title>
                <h2>Fecha</h2>
              </ion-title>
            </ion-item>
          </ion-header>
          <ion-datetime id="datetime" (ionChange)="fecha($event)"></ion-datetime>
          <ion-button>Aceptar</ion-button>
        </ion-modal>
      </div>
    </div>
  </div>

  <div class="buttonenviar">
    <ion-button (click)="confirmarreport()">
      <img src="assets\icon\navigate-outline.svg" alt="">
      Enviar reporte
    </ion-button>
  </div>
</ion-content>
