<ion-content [fullscreen]="true">

  <div class="pagina">

    <div class="ciudad">
      <div class="ciudad-fila">
        @for (n of ciudad; track n) {
          <img src="assets/image/fondoedificios.png" alt="" [class.espejo]="$odd">
        }
      </div>
    </div>

    <div class="contenedor">
      <div class="tarjeta" [class.volteada]="volteada">

        <div class="cara frente" [attr.inert]="volteada ? '' : null">
             <h2 class="titulo">Bienvenido de nuevo</h2>
             
          <label class="etiqueta" for="login-email">Correo electronico</label>
          <div class="campo">
            <ion-icon name="mail-outline"></ion-icon>
            <input id="login-email" type="email" autocomplete="email" placeholder="Tumail@gmail.com" [(ngModel)]="loginEmail">
          </div>

          <label class="etiqueta" for="login-password">Contraseña</label>
          <div class="campo">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input id="login-password" [type]="mostrarLoginPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Contraseña" [(ngModel)]="loginPassword">
            <button class="ojo" (click)="mostrarLoginPassword = !mostrarLoginPassword" aria-label="Mostrar u ocultar contraseña">
              <ion-icon [name]="mostrarLoginPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
            </button>
          </div>

          <p class="olvide">¿Olvidaste tu contraseña?</p>

          @if (errorLogin) {
            <p class="mensaje-error">{{ errorLogin }}</p>
          }

          <button class="boton-principal" (click)="iniciarSesion()">Iniciar sesión</button>

          <div class="separador">o continuar con</div>

          <button class="boton-google" (click)="entrarConGoogle()">
            <img src="assets/icon/iconogoogle.png" alt="" class="logo-google">
            Google
          </button>

          <p class="texto-registro">¿No tenes cuenta? <button class="enlace" (click)="mostrarRegistro()">Registrate</button></p>

        </div>


        <div class="cara dorso" [attr.inert]="volteada ? null : ''">
            <h2 class="tituloo">Completa tus datos para empezar</h2>

          <div class="fila-nombre">
            <div class="columna">
              <label class="etiqueta" for="registro-nombre">Nombre</label>
              <div class="campo">
                <ion-icon name="person-outline"></ion-icon>
                <input id="registro-nombre" type="text" autocomplete="given-name" placeholder="Tu nombre" [(ngModel)]="nombre">
              </div>
            </div>

            <div class="columna">
              <label class="etiqueta" for="registro-apellido">Apellido</label>
              <div class="campo">
                <ion-icon name="person-outline"></ion-icon>
                <input id="registro-apellido" type="text" autocomplete="family-name" placeholder="Tu apellido" [(ngModel)]="apellido">
              </div>
            </div>
          </div>

          <label class="etiqueta" for="registro-email">Correo electronico</label>
          <div class="campo">
            <ion-icon name="mail-outline"></ion-icon>
            <input id="registro-email" type="email" autocomplete="email" placeholder="Tumail@gmail.com" [(ngModel)]="registroEmail">
          </div>

          <label class="etiqueta" for="registro-password">Contraseña</label>
          <div class="campo">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input id="registro-password" [type]="mostrarRegistroPassword ? 'text' : 'password'" autocomplete="new-password" placeholder="Contraseña" [(ngModel)]="registroPassword">
            <button class="ojo" (click)="mostrarRegistroPassword = !mostrarRegistroPassword" aria-label="Mostrar u ocultar contraseña">
              <ion-icon [name]="mostrarRegistroPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
            </button>
          </div>

          <div class="separador">o registrate con</div>

          <button class="boton-google" (click)="entrarConGoogle()">
            <img src="assets/icon/iconogoogle.png" alt="" class="logo-google">
            Google
          </button>

          <label class="terminos">
            <input type="checkbox" [(ngModel)]="aceptaTerminos">
            <span>Acepto los <span class="resaltado">terminos y condiciones</span> y la <span class="resaltado">politica de privacidad</span></span>
          </label>

          @if (errorRegistro) {
            <p class="mensaje-error">{{ errorRegistro }}</p>
          }

          <button class="boton-principal" (click)="crearCuenta()">Crear cuenta</button>

          <button class="volver-login" (click)="mostrarLogin()">Volver al login</button>

        </div>

      </div>
    </div>

  </div>

</ion-content>
