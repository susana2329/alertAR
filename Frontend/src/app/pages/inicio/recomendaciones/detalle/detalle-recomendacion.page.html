<ion-content class="detalle-content" [style.--background]="fondo">
  <div class="contenido">
    <div class="fondo"
    [style.background-image]="emergencia.imagen ? 'url(' + emergencia.imagen + ')' : null">
    </div>
    <div class="barra">
      <button class="volver" (click)="volver()" aria-label="Volver">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <div class="encabezado">
        <h1>{{ emergencia.titulo }}</h1>
        <p>Recomendaciones y acciones</p>
      </div>
    </div>

    <div class="tarjetas">
      <div class="tarjeta" *ngFor="let s of secciones">
        <button class="tarjeta-cabecera" (click)="toggle(s.id)">
          <div class="icono-circulo" [style.background]="s.fondoIcono" [style.color]="s.colorIcono">
            <svg *ngIf="s.icono === 'casa'" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 22 24 8l17 14"/>
              <path d="M12 19v12M36 19v12"/>
              <rect x="20" y="20" width="8" height="7" rx="1"/>
              <path d="M5 34c3-3 6-3 9 0s6 3 9 0 6-3 9 0 6 3 9 0"/>
              <path d="M5 41c3-3 6-3 9 0s6 3 9 0 6-3 9 0 6 3 9 0"/>
            </svg>
            <svg *ngIf="s.icono === 'sirena'" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 31v-7a9 9 0 0 1 18 0v7"/>
              <rect x="11" y="31" width="26" height="7" rx="1.5"/>
              <path d="M24 7v4M10 13l3 3M38 13l-3 3M5 24h4M39 24h4"/>
            </svg>
          </div>
          <div class="textos">
            <h2>{{ s.titulo }}</h2>
            <p>{{ s.subtitulo }}</p>
          </div>
          <ion-icon name="chevron-down-outline" class="chevron" [class.abierta]="abiertas[s.id]"></ion-icon>
        </button>

        <ul class="lista" *ngIf="abiertas[s.id]">
          <li *ngFor="let item of emergencia.contenido[s.id]">
            <span class="check"><ion-icon name="checkmark"></ion-icon></span>
            {{ item }}
          </li>
          <li class="vacio" *ngIf="emergencia.contenido[s.id].length === 0">Contenido próximamente</li>
        </ul>
      </div>
    </div>
  </div>
</ion-content>
