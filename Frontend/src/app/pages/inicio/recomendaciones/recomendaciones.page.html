<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding recomendaciones-content">
  <div class="page-heading">
    <h1>Recomendaciones</h1>
    <p>Consejos y acciones para estar preparado</p>
  </div>

  <ion-searchbar
    class="search-bar"
    placeholder="Buscar recomendaciones"
    [(ngModel)]="terminoBusqueda"
  ></ion-searchbar>

  <h3 class="section-title">Explora por tipo de emergencia</h3>

  <div class="categorias-grid">
    <div
      class="categoria-card"
      *ngFor="let categoria of categorias"
      [class.activa]="categoria.activa"
      (click)="verCategoria(categoria)"
    >
      <div class="icon-circle" [style.background]="categoria.activa ? '#03294F' : '#EEF0F3'">
        <ion-icon
          *ngIf="categoria.id !== 'viento-fuerte'"
          [name]="categoria.icon"
          [style.color]="categoria.iconColor"
        ></ion-icon>
        <svg
          *ngIf="categoria.id === 'viento-fuerte'"
          class="wind-icon"
          [style.color]="categoria.iconColor"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M3 8H14.5C15.8807 8 17 6.88071 17 5.5C17 4.11929 15.8807 3 14.5 3C13.3664 3 12.4078 3.76821 12.1071 4.81349" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3 12H17.5C18.8807 12 20 13.1193 20 14.5C20 15.8807 18.8807 17 17.5 17C16.3664 17 15.4078 16.2318 15.1071 15.1865" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3 16H10.5C11.3284 16 12 16.6716 12 17.5C12 18.3284 11.3284 19 10.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="categoria-label">{{ categoria.nombre }}</p>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="bottom-nav">
    <a class="nav-item" routerLink="/inicio" routerLinkActive="active">
      <ion-icon name="home"></ion-icon>
      <span>Inicio</span>
    </a>
    <a class="nav-item" routerLink="/mapa" routerLinkActive="active">
      <ion-icon name="map-outline"></ion-icon>
      <span>Mapa</span>
    </a>
    <a class="nav-item" routerLink="/reportes" routerLinkActive="active">
      <ion-icon name="document-text-outline"></ion-icon>
      <span>Reportar</span>
    </a>
    <a class="nav-item" routerLink="/prevencion" routerLinkActive="active">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <span>Prevención</span>
    </a>
    <a class="nav-item" routerLink="/cuenta" routerLinkActive="active">
      <ion-icon name="person-outline"></ion-icon>
      <span>Cuenta</span>
    </a>
  </div>
</ion-footer>
