<ion-header class="ion-no-border">
  <div class="report-header">
    <button class="back-button" (click)="volver()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="logo-container">
      <img src="assets/image/ALERT.png" alt="Alert" class="logo-img">
      <img src="assets/image/AR.png" alt="AR" class="logo-img">
    </div>
  </div>
</ion-header>

<ion-content>
  <div class="contenedor">
    <div class="titulos">
      <h1>Recomendaciones</h1>
      <p>Consejos y acciones para estar preparado</p>
    </div>

    <h3 class="section-title">Explora por tipo de emergencia</h3>

    <div class="categorias-grid">
      <div
        class="categoria-card"
        *ngFor="let categoria of categorias"
        [class.activa]="categoria.activa"
        (click)="verCategoria(categoria)"
      >
        <div class="icon-circle">
          <img [src]="categoria.icono" [alt]="categoria.nombre" />
        </div>
        <p class="categoria-label">{{ categoria.nombre }}</p>
      </div>
    </div>
  </div>
</ion-content>
