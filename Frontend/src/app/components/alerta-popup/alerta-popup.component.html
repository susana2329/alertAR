<div class="alerta-popup">
  <h2>{{ alerta.titulo }}</h2>

  <span
    class="nivel"
    [class.emergencia]="alerta.nivel === 'emergencia'"
    [class.advertencia]="alerta.nivel === 'advertencia'"
    [class.precaucion]="alerta.nivel === 'precaucion'"
  >
    {{ alerta.nivel }}
  </span>

  <p>{{ alerta.descripcion }}</p>

  <div class="fuente">
    Fuente: {{ alerta.fuente }}
  </div>

  <button type="button">
    Ver alerta completa
  </button>
</div>
